<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <!-- LogSetu Modern Geometric Wordmark (Cybersecurity & Infrastructure) -->
  <style>
    .wordmark-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.025em;
      fill: currentColor;
    }
    .bridge-arch {
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      fill: none;
      opacity: 0.9;
    }
    .bridge-node {
      fill: currentColor;
    }
  </style>

  <!-- Wordmark Text -->
  <text x="4" y="29" class="wordmark-text">LogSetu</text>

  <!-- Subtle 1.75px Architectural Bridge Span Connecting 'g' to 'S' (Setu Motif) -->
  <path d="M 47 13.5 C 52 8.5, 61 8.5, 66 11.5" class="bridge-arch" />
  
  <!-- Micro Anchor Nodes at Pier Terminus -->
  <circle cx="47" cy="13.5" r="1.2" class="bridge-node" />
  <circle cx="66" cy="11.5" r="1.2" class="bridge-node" />
</svg>
